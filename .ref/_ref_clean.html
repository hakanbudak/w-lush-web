  <style>/* w-lush — light & airy wellness clinic
   Açık yeşil-mavi pastel + bol beyaz, fresh & professional */

:root {
  /* Backgrounds — much lighter, airier */
  --cream: #F4F8F4;        /* hafif yeşil tonlu off-white sayfa fonu */
  --cream-2: #EAF1EA;      /* yumuşak sage tint */
  --cream-3: #DCE7DD;      /* hover/seçili surface */
  --paper: #FFFFFF;        /* tüm kartlar saf beyaz */

  /* Primary — soft sage emerald (forest yerine açık yeşil) */
  --forest: #5B9F7E;       /* primary marka rengi — açık zümrüt */
  --forest-2: #3E7A5E;     /* hover/active deeper */
  --forest-3: #B6D9C3;     /* light surface tint */

  /* Accent — sky blue (champagne yerine) */
  --champagne: #6AA8D4;
  --champagne-2: #4A85B5;
  --champagne-3: #DCEDF8;

  /* Supplemental hues */
  --sage: #7BB394;         /* second green for variety */
  --sage-2: #4F8B6C;
  --sage-soft: #D8EBDF;

  --lavender: #9F94C7;     /* AI tint */
  --lavender-2: #6E60A6;
  --lavender-soft: #E8E2F4;

  --blush: #E8B0AB;        /* warnings */
  --blush-soft: #F5DDD9;

  --sand: #E5D9C0;
  --sand-soft: #F2EBDB;

  /* Ink — soft warm charcoal, not pure black */
  --ink: #2A3530;
  --ink-60: #2A353099;
  --ink-40: #2A353066;
  --ink-20: #2A353033;
  --ink-08: #2A353014;
  --line: #2A35300F;
  --line-strong: #2A35301F;

  --wa-green: #25D366;
  --wa-bg: #ECE5DD;
  --warn: #C97F58;
  --good: #4F8B6C;
  --bad: #C66B65;
}

* { box-sizing: border-box; }

.wl {
  font-family: "Geist", "DM Sans", -apple-system, sans-serif;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.45;
  letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01", "cv11";
}

.wl-serif {
  font-family: "Instrument Serif", "Newsreader", Georgia, serif;
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1;
}

.wl-mono {
  font-family: "JetBrains Mono", "Geist Mono", ui-monospace, monospace;
  letter-spacing: -0.01em;
}

/* ─── shared top nav ─────────────────────── */
.wl-nav {
  display: flex;
  align-items: center;
  height: 64px;
  padding: 0 28px;
  border-bottom: 1px solid var(--line);
  gap: 32px;
  background: var(--cream);
  flex-shrink: 0;
}
.wl-nav-brand {
  font-family: "Instrument Serif", serif;
  font-size: 28px;
  letter-spacing: -0.02em;
  display: flex;
  align-items: baseline;
  gap: 6px;
  white-space: nowrap;
  flex-shrink: 0;
}
.wl-nav-tabs { flex-shrink: 0; }
.wl-nav-right { flex-shrink: 0; }
.wl-nav-brand-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--champagne);
  display: inline-block;
  margin-bottom: 4px;
}
.wl-nav-tabs {
  display: flex;
  gap: 4px;
  margin-left: 8px;
}
.wl-nav-tab {
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-60);
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}
.wl-nav-tab.active {
  color: var(--forest);
  background: var(--cream-2);
}
.wl-nav-tab.ai {
  color: var(--champagne-2);
}
.wl-nav-tab .caret {
  opacity: 0.4;
  font-size: 9px;
}
.wl-nav-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 14px;
}
.wl-search {
  width: 280px;
  height: 38px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 0 14px 0 38px;
  background: var(--paper);
  font-family: inherit;
  font-size: 13px;
  color: var(--ink);
  position: relative;
}
.wl-search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.wl-search-wrap svg {
  position: absolute;
  left: 14px;
  color: var(--ink-40);
}
.wl-search-wrap .kbd {
  position: absolute;
  right: 10px;
  font-family: "Geist Mono", monospace;
  font-size: 10px;
  color: var(--ink-40);
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  padding: 1px 5px;
  background: var(--cream);
}
.wl-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--forest);
  color: var(--cream);
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.05em;
}
.wl-icon-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--ink-60);
  cursor: pointer;
  position: relative;
}
.wl-icon-btn:hover { background: var(--cream-2); }
.wl-icon-btn .dot {
  position: absolute;
  top: 8px; right: 8px;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--champagne);
  border: 2px solid var(--cream);
}

/* ─── card primitives ─────────────────────── */
.wl-card {
  background: var(--paper);
  border-radius: 14px;
  border: 1px solid var(--line);
  overflow: hidden;
}
.wl-card-head {
  padding: 18px 20px 12px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.wl-card-title {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-60);
  font-weight: 500;
}
.wl-card-link {
  font-size: 12px;
  color: var(--forest);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ─── badges & chips ─────────────────────── */
.wl-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 22px;
  padding: 0 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
}
.wl-chip-forest { background: var(--forest); color: var(--cream); }
.wl-chip-champagne { background: var(--champagne-3); color: var(--champagne-2); }
.wl-chip-cream { background: var(--cream-2); color: var(--ink-60); }
.wl-chip-wa { background: #DCF8C6; color: #075E54; }
.wl-chip-warn { background: var(--champagne-3); color: var(--champagne-2); }
.wl-chip-good { background: var(--sage-soft); color: var(--sage-2); }
.wl-chip-bad { background: var(--blush-soft); color: var(--bad); }
.wl-chip-sage { background: var(--sage-soft); color: var(--sage-2); }
.wl-chip-lavender { background: var(--lavender-soft); color: var(--lavender-2); }
.wl-chip-blush { background: var(--blush-soft); color: var(--bad); }
.wl-chip-ai {
  background: linear-gradient(135deg, var(--lavender-soft), var(--blush-soft));
  color: var(--lavender-2);
}
.wl-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  display: inline-block;
}

/* ─── buttons ─────────────────────── */
.wl-btn {
  height: 38px;
  padding: 0 16px;
  border-radius: 10px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.01em;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: filter .15s;
}
.wl-btn:hover { filter: brightness(0.95); }
.wl-btn-primary { background: var(--forest); color: var(--cream); }
.wl-btn-gold { background: var(--ink); color: var(--cream); }
.wl-btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); }
.wl-btn-sm { height: 32px; padding: 0 12px; font-size: 12px; }

/* WhatsApp green */
.wl-wa-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  background: var(--wa-green);
  color: white;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

/* table */
.wl-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.wl-table th {
  text-align: left;
  font-weight: 500;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-40);
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
}
.wl-table td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.wl-table tr:last-child td { border-bottom: none; }

.wl-avatar-sm {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--cream-3);
  color: var(--ink);
  display: inline-grid;
  place-items: center;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  border: 1px solid var(--line);
}
.wl-avatar-stack { display: inline-flex; }
.wl-avatar-stack > * { margin-left: -8px; }
.wl-avatar-stack > *:first-child { margin-left: 0; }

/* scrollbars within artboards stay quiet */
.wl ::-webkit-scrollbar { width: 6px; height: 6px; }
.wl ::-webkit-scrollbar-thumb { background: var(--ink-20); border-radius: 999px; }
</style>

  <style>
    html, body { margin: 0; padding: 0; background: var(--cream-2); font-family: "Geist", sans-serif; transition: background .25s ease; }

      min-height: 100vh;

  <script src="b9143b53-aa68-4773-8871-125b675a0d80" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="c4a7a18a-fe4a-4120-a5b9-c95e4db1614b" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  
  <div id="root"></div>

  <script type="text/babel" src="60e61b45-14cf-4178-83e1-e43c050084d0"></script>
  <script type="text/babel" src="a959b899-782b-4f18-957a-d1fa65435f42"></script>

  <script type="text/babel">
    // Tweakable palette presets — full token swap per palette
    const PALETTES = {
      "Sage Green": {
        cream: '#F4F8F4', cream2: '#EAF1EA', cream3: '#DCE7DD',
        primary: '#5B9F7E', primary2: '#3E7A5E', primary3: '#B6D9C3',
        accent: '#6AA8D4', accent2: '#4A85B5', accent3: '#DCEDF8',
      },
      "Sky Blue": {
        cream: '#F4F7FB', cream2: '#E8EFF7', cream3: '#D8E3F0',
        primary: '#5B89C4', primary2: '#3E68A0', primary3: '#BFD3E9',
        accent: '#6FB89F', accent2: '#4F947E', accent3: '#DCEDE4',
      },
      "Mint Teal": {
        cream: '#F2F8F7', cream2: '#E5F0EE', cream3: '#D2E5E2',
        primary: '#4FA89D', primary2: '#357F76', primary3: '#B5DCD6',
        accent: '#7DA3C8', accent2: '#557FA6', accent3: '#DCE8F3',
      },
      "Soft Emerald": {
        cream: '#F5F9F6', cream2: '#E9F1EC', cream3: '#D5E6DA',
        primary: '#3F8A6A', primary2: '#2C6850', primary3: '#A8CDBA',
        accent: '#85B0D3', accent2: '#5C8AB0', accent3: '#DCE9F4',
      },
    };

    const PALETTE_NAMES = Object.keys(PALETTES);

    function applyPalette(name) {
      const p = PALETTES[name];
      if (!p) return;
      const r = document.documentElement;
      r.style.setProperty('--cream', p.cream);
      r.style.setProperty('--cream-2', p.cream2);
      r.style.setProperty('--cream-3', p.cream3);
      r.style.setProperty('--forest', p.primary);
      r.style.setProperty('--forest-2', p.primary2);
      r.style.setProperty('--forest-3', p.primary3);
      r.style.setProperty('--champagne', p.accent);
      r.style.setProperty('--champagne-2', p.accent2);
      r.style.setProperty('--champagne-3', p.accent3);
    }

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "palette": "Sage Green",
      "showAiBanner": true,
      "showRevenueChart": true,
      "compact": false
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      React.useEffect(() => { applyPalette(t.palette); }, [t.palette]);

      const dashboardStyle = t.compact ? { transform: 'scale(0.96)', transformOrigin: 'top center' } : {};

      return (
        <>
          <div className="stage" style={dashboardStyle}>
            <Dashboard showAiBanner={t.showAiBanner} showRevenueChart={t.showRevenueChart} />
          </div>

          <TweaksPanel title="w-lush · Tweaks">
            <TweakSection label="Renk paleti" />
            <TweakSelect
              label="Palet"
              value={t.palette}
              options={PALETTE_NAMES}
              onChange={(v) => setTweak('palette', v)}
            />
            <TweakSection label="Bölümler" />
            <TweakToggle label="AI banner" value={t.showAiBanner} onChange={(v) => setTweak('showAiBanner', v)} />
            <TweakToggle label="Gelir grafiği" value={t.showRevenueChart} onChange={(v) => setTweak('showRevenueChart', v)} />
            <TweakSection label="Yoğunluk" />
            <TweakToggle label="Kompakt mod" value={t.compact} onChange={(v) => setTweak('compact', v)} />
          </TweaksPanel>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>


</body></html>
