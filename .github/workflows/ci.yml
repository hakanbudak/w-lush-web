name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Reject any commit that carries Co-authored-by / Claude attribution,
  # on PRs and on direct pushes to main.
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject forbidden commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif git rev-parse -q --verify "${{ github.event.before }}^{commit}" >/dev/null 2>&1; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            # First push on a branch, or the history was rewritten: the previous
            # tip no longer exists, so a range would be an invalid revision.
            range="-1 ${{ github.sha }}"
          fi

          if git log --format='%B' $range | grep -iE 'co-authored-by|noreply@anthropic\.com|generated with .*claude|claude\.com/claude-code'; then
            echo "::error::Forbidden trailer found (Co-authored-by / Claude attribution). Remove it and re-push."
            exit 1
          fi

          subjects=$(git log --format='%s' $range)
          if [ -n "$(printf '%s' "$subjects" | LC_ALL=C tr -d '\000-\177')" ]; then
            echo "::error::A commit subject is not plain ASCII. Commit messages are written in English."
            printf '%s\n' "$subjects"
            exit 1
          fi

          echo "Commit messages are clean."
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
